AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Timeout: 3
    MemorySize: 128
Resources:
  DomainQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: monitor-domain-queue
  QueueUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: QueueUrlSecret
      Description: Queue URL SQS
      SecretString:
        Fn::Sub: "{\n  \"QUEUE_URL\": \"${DomainQueue}\"\n}\n"
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: CtMonitorApiKey
      Description: API Key
      Enabled: true
      Value:
        Fn::Sub:
        - ${Hash}
        - Hash:
            Fn::Select:
            - 2
            - Fn::Split:
              - /
              - Ref: AWS::StackId
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: CtMonitorApiKey
      Description: API Key Save In SecretManager
      SecretString:
        Fn::Sub:
        - "{\n  \"API_KEY\": \"${Hash}\"\n}\n"
        - Hash:
            Fn::Select:
            - 2
            - Fn::Split:
              - /
              - Ref: AWS::StackId
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: CtMonitorUsagePlan
      Description: Usage plan for CT Monitor API
      Throttle:
        BurstLimit: 100
        RateLimit: 50
      Quota:
        Limit: 10000
        Period: DAY
      ApiStages:
      - ApiId:
          Ref: ServerlessRestApi
        Stage:
          Ref: ServerlessRestApiProdStage
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: ApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: UsagePlan
  CtLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ct-logs
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
  ProducerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ProducerFunction
    Properties:
      CodeUri: ProducerFunction
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
      - x86_64
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /search
            Method: GET
            Auth:
              ApiKeyRequired: true
      Environment:
        Variables:
          SECRET_NAME:
            Ref: QueueUrlSecret
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - DomainQueue
            - QueueName
      - SecretsManagerReadWrite
      - AmazonDynamoDBFullAccess
  DomainQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: DomainQueue
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal: '*'
          Action:
          - sqs:SendMessage
          Resource:
          - Fn::GetAtt:
            - DomainQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - ProducerFunction
                - Arn
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ConsumerFunction
    Properties:
      CodeUri: ConsumerFunction
      Policies: AmazonDynamoDBFullAccess
      Handler: bootstrap
      Runtime: provided.al2023
      Timeout: 30
      Architectures:
      - x86_64
      Events:
        SqsEvents:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - DomainQueue
              - Arn
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
  ApiKeySecretName:
    Description: Name of the secret containing the API Key
    Value:
      Fn::Sub:
      - ${Hash}
      - Hash:
          Fn::Select:
          - 2
          - Fn::Split:
            - /
            - Ref: AWS::StackId
